name: QA Sentinel protocol regression
description: Report a reproducible problem in the skill instructions, validator, or report artifacts
title: "[Protocol] "
body:
  - type: markdown
    attributes:
      value: |
        Please use a small, non-sensitive reproduction. Do not upload secrets,
        personal data, or private application audit evidence.
  - type: dropdown
    id: area
    attributes:
      label: Affected component
      options:
        - Agent protocol (SKILL.md)
        - Structural validator
        - Generated audit validator
        - Templates or report contract
        - Documentation or integrations
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the precise error or unexpected artifact, with sensitive information redacted
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, representative input, and relevant tool versions
      placeholder: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain the behavior required by the documented protocol
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Non-sensitive diagnostics or proposed solution, if available
    validations:
      required: false

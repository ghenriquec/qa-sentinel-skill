name: Validate QA Sentinel skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure and protocol invariants
        run: bash scripts/validate-skill.sh
      - name: Test validator failure handling
        run: bash tests/test-validate-skill.sh
